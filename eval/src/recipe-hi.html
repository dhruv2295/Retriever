<!doctype html><meta charset="utf-8"><body style="font-family:'Kohinoor Devanagari','Devanagari Sangam MN';font-size:16pt"><h1>आलू पराठा</h1><p><b>सामग्री:</b> गेहूँ का आटा, उबले हुए आलू, हरी मिर्च, धनिया, नमक, अजवाइन और घी।</p>
<p><b>विधि:</b> आलू को मसलकर उसमें नमक, मिर्च और धनिया मिलाएँ। आटा गूँधकर लोइयाँ बनाएँ, उनमें आलू का मसाला भरें और बेल लें। तवे पर घी लगाकर दोनों तरफ़ सुनहरा होने तक सेंकें। दही या अचार के साथ गरमागरम परोसें।</p></body>
