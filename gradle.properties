org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# :core's iosMain calls the vecscan cinterop (core/build.gradle.kts), so both iOS targets' bindings are commonized for it.
kotlin.mpp.enableCInteropCommonization=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# Kotlin/Native's tools (cinterop) run in their own JVM and load a native library (System.load); without this the
# JDK warns that the call will be blocked in a future release.
kotlin.native.jvmArgs=--enable-native-access=ALL-UNNAMED
# androidApp's bundle { deviceTargetingConfig }: Play installs each Snapdragon NPU runtime module only on its SoC
# (developer.android.com/google/play/device-targeting, beta).
android.experimental.enableDeviceTargetingConfigApi=true
