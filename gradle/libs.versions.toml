[versions]
kotlin = "2.4.21"
agp = "9.4.1"
coroutines = "1.11.0"
serialization = "1.12.0"
sqldelight = "2.4.1"
composeBom = "2026.09.00"
activity = "1.13.0"
coreKtx = "1.19.1"
splashscreen = "1.2.0"
lifecycle = "2.11.0"
mediapipe = "1.1.1"
# tasks-retrieval 1.1.1 declares 0.17.0-alpha1 but calls classes added later (ActivationDataType).
litertlm = "0.18.0"
mlkitText = "16.0.1"
mlkitLabel = "17.0.9"
navigation = "2.10.2"
work = "2.12.0"
media3 = "1.11.1"
compileSdk = "37"
minSdk = "30"
# LiteRT and its NPU runtimes ship together.
litert = "2.3.0"
mlkitFace = "17.1.0"
junit = "4.13.2"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
robolectric = "4.17"
koin = "4.2.2"
composeLint = "1.6.1"
leakcanary = "2.14"
kover = "0.9.11"
telephoto = "0.19.0"
playPublisher = "4.1.1"
# Constraints only: patched versions of transitive dependencies (see androidApp/build.gradle.kts).
okhttp = "4.12.1"
protobuf = "4.36.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
